---
# ${VAR} substitution is applied recursively to every string in the config
# (including inside lists and dicts) before the API calls run.
# Usage:
#   export DEPLOY_REGION=AMS1
#   export SC_ENV=production
#   ansible-inventory -i 08_env_var_substitution.sc_api.yml --list
# An unset variable raises AnsibleParserError naming the missing variable.
plugin: serverscom.sc_api.sc_inventory
resources:
  - type: dedicated_server
    locations:
      - ${DEPLOY_REGION}
    labels:
      environment: ${SC_ENV}
    group_by: location_code
