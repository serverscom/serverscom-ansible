---
# Cloud instances filtered by label, addressed over private IPv4.
# All matched hosts go into the `staging` group and pick up extra connection vars.
plugin: serverscom.sc_api.sc_inventory
resources:
  - kind: cloud
    labels:
      environment: staging
    status_filter: [ACTIVE]
    ansible_host: private_ipv4
    assign_inventory_group: staging
    extra_vars:
      ansible_user: ubuntu
      ansible_python_interpreter: /usr/bin/python3
