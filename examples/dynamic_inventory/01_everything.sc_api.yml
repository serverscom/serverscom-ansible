---
# Minimal config: no `resources:` at all.
# Omitting `resources:` (or setting it to []) fetches every kind
# (baremetal + sbm + k8s_nodes + cloud) with no filters. If you add any
# entry to `resources:`, that entry must specify `kind:`.
# Token is read from SERVERSCOM_API_TOKEN (or SC_TOKEN) env var.
plugin: serverscom.sc_api.sc_inventory
