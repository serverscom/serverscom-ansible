---
# `name_regex` is applied with `re.search` against the host's title
# (bare-metal) or name (cloud). Both blocks point at `web_tier`, so cloud and
# bare-metal hosts matching `^web-` land in the same Ansible group.
plugin: serverscom.sc_api.sc_inventory
resources:
  - type: cloud_server
    name_regex: "^web-"
    assign_inventory_group: web_tier

  - type: dedicated_server
    name_regex: "^web-"
    assign_inventory_group: web_tier
